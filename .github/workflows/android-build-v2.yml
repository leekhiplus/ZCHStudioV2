name: Android Build V2
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          # Use exactly one file. Browser re-uploads create names like "ZCHStudioV2 (2).zip",
          # and "head -n1" would silently pick an old copy.
          COUNT=$(ls ZCHStudioV2*.zip | wc -l)
          if [ "$COUNT" -ne 1 ]; then
            echo "Found $COUNT ZCHStudioV2 zip files. Keep only one ZCHStudioV2 zip in the repo root."
            ls -la ZCHStudioV2*.zip
            exit 1
          fi
          unzip -q "$(ls ZCHStudioV2*.zip)" -d proj
          echo "Built from: $(ls ZCHStudioV2*.zip)"
          grep -q "CardsScreen" proj/app/src/main/java/com/zch/studio/MainActivity.kt && echo "Phase 1 code found" || { echo "Old skeleton zip, aborting"; exit 1; }
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          # Since API 37 the SDK Manager installs the platform as android-37.0
          "$SDKM" "platforms;android-37.0"
          # Pick the newest installed-able 37.x build-tools instead of a fixed number
          BT=$("$SDKM" --list | grep -o 'build-tools;37[^ ]*' | sort -V | tail -n1)
          echo "Using $BT"
          "$SDKM" "$BT"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"
      - name: Build debug APK
        working-directory: proj
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ZCH-Studio-V2-debug-apk
          path: proj/app/build/outputs/apk/debug/*.apk
