name: Android Build V2
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q "$(ls ZCHStudioV2*.zip | head -n1)" -d proj
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          # Since API 37 the SDK Manager installs the platform as android-37.0
          "$SDKM" "platforms;android-37.0"
          # Pick the newest installed-able 37.x build-tools instead of a fixed number
          BT=$("$SDKM" --list | grep -o 'build-tools;37[^ ]*' | sort -V | tail -n1)
          echo "Using $BT"
          "$SDKM" "$BT"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"
      - name: Build debug APK
        working-directory: proj
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ZCH-Studio-V2-debug-apk
          path: proj/app/build/outputs/apk/debug/*.apk
